CONSTANTS
    Journals = {journal1, journal2}
    Journal1 = journal1
    Journal2 = journal2
    Records = {record1, record2, record3}
    Record1 = record1
    Record2 = record2
    Record3 = record3
    Notes = {noteX, noteY}
    NoteX = noteX
    NoteY = noteY
    Values = {xBase, xUpdate1, xUpdate2, yBase, yUpdate, deleted}
    XBase = xBase
    XUpdate1 = xUpdate1
    XUpdate2 = xUpdate2
    YBase = yBase
    YUpdate = yUpdate
    Deleted = deleted
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT EveryRecordHasExactlyOneDisposition
INVARIANT EveryRecordRemainsJournalBackedOrCheckpointCovered
INVARIANT EveryValidUpdateRemainsRecoverable
INVARIANT CompletedRecoveryPreservesEveryUpdateIndependentOfOrder
INVARIANT IndependentNoteUpdatesBothSurvive
INVARIANT DeleteUpdateRaceNeverLosesTheUpdate
INVARIANT BaseMismatchCannotOverwriteOrDelete
INVARIANT WithinJournalOrderIsPreserved
INVARIANT WithinJournalDeleteThenUpdateEndsUpdated
INVARIANT AppliedDeleteCannotBeResurrectedAcrossJournals
INVARIANT DuplicateScenarioIsIdempotent
INVARIANT DeletedJournalsWereCompletelyCovered

PROPERTY RecoveryProgress

CHECK_DEADLOCK FALSE
