CONSTANTS
    Notes = {note1, note2}
    CheckpointIDs = {
        checkpoint0, checkpoint1, checkpoint2, checkpoint3, checkpoint4
    }
    InitialCheckpoint = checkpoint0
    CredentialIDs = {credential0, credential1, credential2}
    InitialCredentialID = credential0
    OldKey = oldKey
    NewKey = newKey
    MaxCatalogToken = 2
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT LiveNotesAlwaysHaveARecoverableArtifact
INVARIANT OldJournalDeletionWasHistoricallyQualified
INVARIANT OldCheckpointInstallHadEverySettledInput
INVARIANT ActiveRecordClearsOnlyAfterJournalRemoval
INVARIANT OldCheckpointIsTheRestartMarkerUntilNewInstall
INVARIANT NewInstallRequiresCompleteStableExport
INVARIANT RekeyInstallRequiresReadBackFreshCredential
INVARIANT EveryInstalledRememberedCheckpointHasItsCredential
INVARIANT TargetProvisioningNeverInvalidatesAcceptedCredential
INVARIANT OldCredentialCleanupIsPostCommit
INVARIANT DivergentFilesForceRetryOrArePreservedBeforeVerification
INVARIANT EditingRequiresOneConsistentArtifactContract
INVARIANT FinalStorageModeIsDerivedFromArtifacts
INVARIANT NoMigrationPhaseLedger
INVARIANT CheckpointIDsAreNeverReused
INVARIANT CredentialIDsAreNeverReused

PROPERTY ExportProgress
PROPERTY FreshJournalProgress
PROPERTY ChangedFenceProgress

CHECK_DEADLOCK FALSE
