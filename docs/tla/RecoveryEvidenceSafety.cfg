CONSTANTS
    DatabaseVersions = {databaseVersion1, databaseVersion2}
    DatabaseVersion1 = databaseVersion1
    DatabaseVersion2 = databaseVersion2
    JournalVersions = {journalVersion1, journalVersion2}
    JournalVersion1 = journalVersion1
    JournalVersion2 = journalVersion2
    NoteStates = {liveState, recoveryState1, recoveryState2}
    LiveState = liveState
    RecoveryState1 = recoveryState1
    RecoveryState2 = recoveryState2
    RecoveryIDs = {recoveryID1, recoveryID2}
    RecoveryID1 = recoveryID1
    RecoveryID2 = recoveryID2
    Settings = {liveSettings, foreignSettings}
    LiveSettings = liveSettings
    ForeignSettings = foreignSettings
    MaxCatalogToken = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT RecoveryNeverOverwritesOriginalOrSettings
INVARIANT ImportedNotesHaveDeterministicConflictIdentities
INVARIANT IntentionalTombstonesPreventResurrection
INVARIANT DeleteAndSettingsEvidenceHasNoNoteContribution
INVARIANT IdenticalLiveEvidenceHasNoNoteContribution
INVARIANT CompleteRunsHadExactAllVersionSnapshots
INVARIANT RecoveryEligibilityRequiredCompleteExactRecovery
INVARIANT UnclaimedJournalEvidenceWithPossibleWriterIsNeverConsumed
INVARIANT DiscardNeverBroadensItsConfirmedSnapshot
INVARIANT PartialOrFailedRunsDoNotGainResolutionEligibility
INVARIANT UnclaimedJournalEvidenceNeverGainsResolutionEligibility
INVARIANT IdleScratchIsCanonical

PROPERTY ExplicitRecoveryProgress
PROPERTY RoutineSyncPreservesRecoveryEvidence

CHECK_DEADLOCK FALSE
