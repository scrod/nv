CONSTANTS
    Versions = {version1, version2, duplicateVersion}
    Version1 = version1
    Version2 = version2
    DuplicateVersion = duplicateVersion
    NoteStates = {initialCurrentState, conflictState1, conflictState2}
    InitialCurrentState = initialCurrentState
    ConflictState1 = conflictState1
    ConflictState2 = conflictState2
    RecoveryIDs = {recoveryID1, recoveryID2}
    RecoveryID1 = recoveryID1
    RecoveryID2 = recoveryID2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUndisclosedResolution
INVARIANT ProviderHistoryIsNeverRemoved
INVARIANT ResolutionIsExplicitlyPartitioned
INVARIANT SavedResolutionHasInstalledCopy
INVARIANT ChosenResolutionHasInstalledCurrent
INVARIANT EverySavedResolutionHasWitness
INVARIANT EveryChosenResolutionHasWitness
INVARIANT CopiesAreDeterministicAndIdempotent
INVARIANT RetiredCopiesAreNeverReused
INVARIANT CurrentBodyChangesOnlyThroughChoice

CHECK_DEADLOCK FALSE
