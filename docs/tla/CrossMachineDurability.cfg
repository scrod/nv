CONSTANTS
    Hosts = {writerHost, readerHost}
    WriterHost = writerHost
    ReaderHost = readerHost
    Journals = {writerJournal, readerJournal}
    WriterJournal = writerJournal
    ReaderJournal = readerJournal
    CheckpointIDs = {checkpoint0, checkpoint1}
    InitialCheckpoint = checkpoint0
    NewCheckpoint = checkpoint1
    Edit = edit
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AcknowledgedEditAlwaysHasRecoverableEvidence
INVARIANT ServerDeletionRequiresUploadedCheckpointCoverage
INVARIANT QualificationNamesExactServerCheckpoint
INVARIANT WriterClaimDisappearsOnlyAfterSafeCleanup
INVARIANT RetainedClaimsHaveExactLocalCoverage
INVARIANT ClaimsNeverTransferBetweenHosts
INVARIANT ReaderPreferenceSentinelSurvivesWriterLifecycle
INVARIANT ObservedOmissionRemainsRecoverableAndVisible
INVARIANT OfflineEditingRemainsVisibleAndPending
INVARIANT DeleteBeforeCheckpointDeliveryCannotLoseTheEdit

PROPERTY HostStepsPreserveForeignPreferences
PROPERTY ProviderStepsPreserveAllHostPreferences

CHECK_DEADLOCK FALSE
