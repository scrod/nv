CONSTANTS
    Hosts = {writerHost, readerHost}
    WriterHost = writerHost
    ReaderHost = readerHost
    Journals = {journal1, journal2}
    Journal1 = journal1
    Journal2 = journal2
    CheckpointIDs = {checkpoint0, checkpoint1, checkpoint2, checkpoint3}
    Checkpoint0 = checkpoint0
    Checkpoint1 = checkpoint1
    Checkpoint2 = checkpoint2
    Checkpoint3 = checkpoint3
    Edits = {edit1, edit2}
    Edit1 = edit1
    Edit2 = edit2
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT EveryGuaranteedAcknowledgedEditHasRecoverableEvidence
INVARIANT WriterLossExemptionIsExplicit
INVARIANT ServerDeletionRequiresExactCoveringCheckpoint
INVARIANT QualificationNamesTheExactCleanupReceipt
INVARIANT ReorderedDeletionCannotLoseItsJournalEdit
INVARIANT ReaderObservedOmissionRemainsVisible

CHECK_DEADLOCK FALSE
