CONSTANTS
    Incarnations = {initialIncarnation, replacementIncarnation}
    InitialIncarnation = initialIncarnation
    ReplacementIncarnation = replacementIncarnation
    NoteIDs = {originalNoteID, freshNoteID}
    OriginalNoteID = originalNoteID
    FreshNoteID = freshNoteID
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT EveryRemovalMatchedTheExactAcceptedIncarnation
INVARIANT ReplacementIncarnationIsNeverRemovedByOriginalDeletion
INVARIANT ReplacementIsNeverReattachedToDeletedUUID
INVARIANT DeletionMismatchPreservesAndImportsReplacement
INVARIANT EveryPhysicalAbsenceHasAuthorizedOrigin
INVARIANT RemovalFollowsLocalDurability

PROPERTY CheckpointOmissionNeverRemovesAFile
PROPERTY RetirementNeverRemovesAFile

CHECK_DEADLOCK FALSE
