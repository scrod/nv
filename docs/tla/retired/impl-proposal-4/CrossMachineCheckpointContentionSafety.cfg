CONSTANTS
    Hosts = {hostA, hostB}
    HostA = hostA
    HostB = hostB
    Decisions = {decisionA, decisionB}
    DecisionA = decisionA
    DecisionB = decisionB
    RetiredIDs = {retiredA, retiredB}
    RetiredA = retiredA
    RetiredB = retiredB
    NoVersion = noVersion
    MaxCheckpointVersion = 3

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT PublishedCheckpointBodiesAreMonotonic
INVARIANT PublishedRetirementsAreMonotonic
INVARIANT JoinedCheckpointContainsBothBranches
INVARIANT RetirementUnionIsDurableBeforeRetry
INVARIANT RetrySettlementNamesExactCapturedVersion
PROPERTY EveryFirstWriteUsedExactCurrent
PROPERTY CurrentChangedNeverWrites
PROPERTY StaleRetryNeverWrites
PROPERTY EveryRetryWriteUsedExactDurableSettlement
PROPERTY CrashPreservesDurableMergeEvidence
PROPERTY RestartUnionsCurrentWithAllDurableEvidence

CHECK_DEADLOCK FALSE
