CONSTANTS
    Versions = {canonicalVersion, unresolvedVersion, nonlocalVersion}
    CanonicalVersion = canonicalVersion
    UnresolvedVersion = unresolvedVersion
    NonlocalVersion = nonlocalVersion
    States = {baseState, localState, remoteState, otherState, mergedState, deleted}
    BaseState = baseState
    LocalState = localState
    RemoteState = remoteState
    OtherState = otherState
    MergedState = mergedState
    Deleted = deleted
    Names = {baseName, localName, remoteName}
    BaseName = baseName
    LocalName = localName
    RemoteName = remoteName
    EnabledScenarios = {
        "fastForward", "twoEditsMerge", "missingBase", "unsafeMerge",
        "deleteEdit", "localDeleteRemoteEdit", "renameRace", "renameOnlyRace",
        "renameRemoteEdit", "unmatchedIdentity", "ambiguousIdentity",
        "pathTimestampIdentity", "filenameContentIdentity", "multiVersion",
        "localEditRemoteUnchanged", "remoteRenameLocalEdit",
        "remoteRenameOnly", "localRenameRemoteUnchanged",
        "localRenameRemoteDelete", "localDeleteRemoteRename",
        "localRenameTwoEditsMerge", "remoteRenameTwoEditsMerge"
    }

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT EveryProcessedVersionIsRepresented
INVARIANT SnapshotIsRepresentedWhenItDiffersFromPristineBase
INVARIANT ArtifactsHaveProcessedProvenance
INVARIANT IdentityPolicyIsExact
INVARIANT LocalWinsRecordsBaseAncestry
INVARIANT ScenarioDecisionsMatchIndependentOracle

PROPERTY AllVersionsEventuallyProcessed

CHECK_DEADLOCK FALSE
