CONSTANTS
    Policy = "safe"
    Hosts = {hostA, hostB}
    HostA = hostA
    HostB = hostB
    Members = {member1, member2}
    Member1 = member1
    Member2 = member2
    Bodies = {body1, body2}
    Body1 = body1
    Body2 = body2
    CurrentBody = currentBody
    RecoveryIDs = {recoveryID1, recoveryID2}
    RecoveryID1 = recoveryID1
    RecoveryID2 = recoveryID2
    NoID = noID
    NoBody = noBody
    ModifiedBody = modifiedBody
    MaxSourceVersion = 3
    MaxCandidateGeneration = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ProviderMembershipIsPartitioned
INVARIANT OnlyDisclosedMembersResolve
INVARIANT ProviderHistoryIsNeverRemoved
INVARIANT PreparedCopiesUseDeterministicIdentity
INVARIANT ConcurrentSavesOfOneMemberShareIdentity
PROPERTY ResolutionIsMonotonic
PROPERTY ExactSavedCopyReusePreservesLocalGeneration
PROPERTY SavedResolutionIsSelectedMemberOnly
PROPERTY SavedResolutionRequiresExactInstalledCopy
PROPERTY UseResolutionIsExactlySnapshotScoped
PROPERTY UseResolutionRequiresExactInstalledCurrent
PROPERTY SourceBodyChangesOnlyThroughExplicitChoiceOrEdit
PROPERTY LocalChoiceDoesNotMutateOtherHostSource

CHECK_DEADLOCK FALSE
