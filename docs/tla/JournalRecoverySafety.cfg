CONSTANTS
    CheckpointIDs = {checkpoint0, checkpoint1, checkpoint2}
    InitialCheckpoint = checkpoint0
    OtherCheckpoint = checkpoint1
    NoteStates = {baseState, localState, remoteState1, remoteState2, deleted}
    BaseState = baseState
    LocalState = localState
    RemoteState1 = remoteState1
    RemoteState2 = remoteState2
    Deleted = deleted
    Settings = {initialSettings, recoveredSettings}
    InitialSettings = initialSettings
    RecoveredSettings = recoveredSettings
    RecordCount = 2
    None = None

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT OnlyTheCompleteValidPrefixIsProcessed
INVARIANT BaseMismatchCannotOverwriteDeleteOrRestoreSettings
INVARIANT BaseMismatchDifferingUpdatesBecomeConflicts
INVARIANT ExactBaseReplayRespectsRecordOrder
INVARIANT InvalidOrUnprocessedSuffixRemainsEvidence
INVARIANT ValidRecordsRemainRecoverable
INVARIANT CleanupWasHistoricallyQualified
INVARIANT UnqualifiedProviderRootsRetainJournal
INVARIANT InvalidHeaderNeverAuthorizesRecoveryOrDeletion

PROPERTY RecoveryProgress

CHECK_DEADLOCK FALSE
